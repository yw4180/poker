# 生产：在服务器上 `bash deploy.sh`（会读取同目录 .env）
services:
  postgres:
    image: postgres:16-alpine
    container_name: poker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: poker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: poker
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U poker']
      interval: 5s
      retries: 10
    networks:
      - internal

  server:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
    container_name: poker-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://poker:${POSTGRES_PASSWORD}@postgres:5432/poker
      API_URL: https://${DOMAIN}
      WEB_ORIGIN: https://${DOMAIN}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    networks:
      - internal
      - web

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    container_name: poker-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
    networks:
      - web

networks:
  internal:
  web:
    external: true

volumes:
  pgdata:
  uploads:
